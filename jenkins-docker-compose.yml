# Spins up Jenkins locally, built with a real Docker CLI baked in, and with
# access to the HOST's Docker daemon via the mounted socket ("Docker-outside-
# of-Docker" — Jenkins' container talks to the host engine via the socket
# rather than running its own nested Docker).
#
# Usage:
#   docker compose -f jenkins-docker-compose.yml up -d --build
#   open http://localhost:8081
#
# First run: get the initial admin password with
#   docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword

services:
  jenkins:
    build: .
    container_name: jenkins
    user: root                 # needed to use the mounted docker.sock
    ports:
      - "8081:8080"            # Jenkins web UI (host:container)
      - "50000:50000"          # agent connection port
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
